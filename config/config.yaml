# Quant Bot Platform -- configuration
#
# This file is the single source of truth for symbols, model
# hyperparameters, and risk limits. scripts/*.py resolve their universe
# from here via config/loader.py rather than hardcoding their own symbol
# lists, so retargeting the platform is a config edit, not a code edit.
#
# Every symbol in one run must come from ONE provider, and all symbols
# share a single bar grid -- backtest/engine.py requires a byte-identical
# timestamp index across symbols (config/loader.py::align_to_common_index
# enforces this). That's why the pipeline runs one asset class at a time
# rather than blending crypto and forex into a single equity curve.

mode: paper  # backtest | paper | live

symbols:
  # Real Binance spot pairs, fetched by scripts/fetch_market_data.py.
  # Public OHLCV needs no API key; keys are only for order placement.
  crypto:
    - "BTC/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
    - "BNB/USDT"
  # Forex needs a free OANDA practice token to run on real data
  # (https://www.oanda.com/demo-account/tpa/personal_token). Left
  # synthetic here so the provider stays exercisable offline. Set
  # data_provider.forex.type to 'oanda' and fill OANDA_API_TOKEN to use
  # real FX -- and run forex as its own pipeline pass, not mixed with
  # crypto above.
  forex:
    - "EUR/USD"
    - "GBP/USD"

timeframe: "5m"

data_provider:
  crypto:
    type: ccxt          # synthetic | ccxt
    exchange_id: binance # used when type: ccxt (use binanceus if your IP is US-based)
  forex:
    type: synthetic     # synthetic | oanda
    practice: true        # used when type: oanda

model:
  horizon_bars: 12          # predict forward return over this many bars
  cost_threshold_bps: 30    # ROUND-TRIP cost: label only fires if move exceeds entry+exit fees+slippage combined
  n_folds: 5                # walk-forward folds
  min_train_bars: 500

strategy:
  long_threshold: 0.58
  short_threshold: 0.42

risk:
  risk_per_trade_pct: 0.5
  stop_loss_atr_mult: 2.0
  take_profit_atr_mult: 3.5
  max_position_pct: 20
  max_total_exposure_pct: 60
  max_daily_loss_pct: 3
  max_drawdown_pct: 15

backtest:
  starting_equity: 100000
  fee_bps: 10       # per-side trading fee, basis points
  slippage_bps: 5    # adverse price adjustment applied to every fill

orchestrator:
  poll_seconds: 60      # real deployments: match your timeframe (e.g. 300 for 5m bars)
  lookback_bars: 150

# How much history the fetch script pulls. 20000 5-minute bars is ~69 days
# -- long enough that daily-resampled Sharpe/Sortino mean something. The
# deployed bootstrap uses a smaller window so a free-tier container can
# build its artifacts before the health check times out.
history:
  bars: 20000
  bootstrap_bars: 6000   # used by scripts/bootstrap.py (container startup)
